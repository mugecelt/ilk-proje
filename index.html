<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Yapılacaklar Listesi</title>
  <!-- Stil dosyasını bağla -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Yapılacaklar Listesi</h1>

    <!-- Görev ekleme kutusu -->
    <div class="input-area">
      <input type="text" id="taskInput" placeholder="Yeni görev yaz...">
      <button id="addBtn">Ekle</button>
    </div>

    <!-- Görevlerin listeleneceği alan -->
    <ul id="taskList"></ul>
  </div>

  <!-- JS dosyasını bağla -->
  <script src="script.js"></script>
</body>
</html>
